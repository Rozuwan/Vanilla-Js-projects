<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz app</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Quiz App</h1>

    <div class="quiz-container">
        <div class="quiz-wrapper">

            <div class="quiz-header">
                <h2 id="question">
                </h2>
            </div>

            <div class="options">

                <label>
                    <input type="radio" name="answer" id="radio1">
                    <span id="option1"></span>
                </label>

                <label>
                    <input type="radio" name="answer" id="radio2">
                    <span id="option2"></span>
                </label>

                <label>
                    <input type="radio" name="answer" id="radio3">
                    <span id="option3"></span>
                </label>

                <label>
                    <input type="radio" name="answer" id="radio4">
                    <span id="option4"></span>
                </label>

            </div>

            <div class="quiz-footer">
                <button id="next-btn">Next Question</button>
            </div>
        </div>
    </div>

</body>
<script src="script.js"></script>

</html>
