<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/gilroy">
    <link rel="stylesheet" href="style.css">
    <title>TaskManager</title>
</head>

<body>
    <div class="main">
        <div class="main-wrapper">
            <div class="main-items">
                <h1 id="header">Your To Do</h1>
                <div class="input-field">
                    <input id="inp" type="text" placeholder="Add new Task">
                    <button id="inp-btn" class="btn">+</button>
                </div>
                <div class="tasks">
                    <label>
                        <input type="checkbox">
                        Get up
                    </label>
                    <button id="del-btn" class="btn">×</button>
                </div>
                <div class="details">
                <p>Your remaining todos: <span>0</span></p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
